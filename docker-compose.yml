# Docker Compose for nas-port-mcp
# Deploy: import in DSM Container Manager as a Project.
#
# network_mode: host is REQUIRED — `ss` must observe the host network namespace.
# docker.sock is mounted READ-ONLY for published-port attribution.
# The proxy binds 127.0.0.1:${MCP_PORT:-3001}; front it with `tailscale serve`.

services:
  app:
    image: ghcr.io/nickbrett1/nas-port-mcp:latest
    container_name: nas-port-mcp
    restart: unless-stopped
    network_mode: host
    environment:
      - MCP_PORT=${MCP_PORT:-3001}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Services"
      - "homepage.name=nas-port-mcp"
      - "homepage.href=http://nas:3001/"
      - "homepage.widget.type=customapi"
      - "homepage.widget.url=http://localhost:3001/healthz"
