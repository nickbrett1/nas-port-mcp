# Homepage services.yaml snippet for nas-port-mcp
# The container binds 127.0.0.1:3001 (host networking) — the widget URL only
# resolves from a container sharing the host netns. Otherwise use the
# tailscale-serve URL (e.g. https://nas).

- nas-port-mcp:
    icon: sh-docker
    href: http://nas:3001/
    description: Host port allocator (MCP)
    widget:
      type: customapi
      url: http://localhost:3001/healthz
