[project]
name = "nas-port-mcp"
version = "0.1.0"
description = "A nas-port-mcp project generated with genproj"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # mcpo (latest 0.0.20) and FastMCP both target the mcp 1.x API; mcp 2.0.0
    # removed mcp.server.fastmcp and renamed client helpers mcpo imports, so it
    # crashes at startup. Hold <2.0.0 until mcpo ships a 2.x-compatible release.
    "mcp>=1.17.0,<2.0.0",
    "mcpo>=0.0.20",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
