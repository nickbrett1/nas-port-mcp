[project]
name = "nas-port-mcp"
version = "0.1.0"
description = "A nas-port-mcp project generated with genproj"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # mcpo (latest 0.0.20) and FastMCP both target the mcp 1.x API; mcp 2.0.0
    # removed mcp.server.fastmcp and renamed client helpers mcpo imports, so it
    # crashes at startup. Hold <2.0.0 until mcpo ships a 2.x-compatible release.
    # Dependabot ignore rule in .github/dependabot.yml blocks re-loosening to 2.x.
    "mcp>=1.17.0,<2.0.0",
    # mcpo 0.0.20 passes ssl_certfile/ssl_keyfile straight into the FastAPI()
    # constructor. That only ever worked because FastAPI.__init__ had a **extra
    # catch-all swallowing unknown kwargs; FastAPI 0.145.0 removed it, so every
    # later release raises "TypeError: FastAPI.__init__() got an unexpected
    # keyword argument 'ssl_certfile'" and the container crash-loops on boot.
    # Hold <0.145 until mcpo stops forwarding those kwargs (it passes them to
    # uvicorn.run correctly, so only the FastAPI() call needs fixing).
    # Dependabot ignore rule in .github/dependabot.yml blocks re-loosening.
    "fastapi<0.145",
    "mcpo>=0.0.20",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
