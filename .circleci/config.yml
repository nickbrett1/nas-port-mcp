version: 2.1
orbs:
commands:
  install_doppler:
    description: "Install Doppler CLI"
    steps:
      - run:
          name: Install Doppler CLI
          command: |
            if ! command -v doppler &> /dev/null; then
              (curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh || wget -t 3 -qO- https://cli.doppler.com/install.sh) | sudo sh
            fi
jobs:
  build:
    docker:
      - image: cimg/python:3.12

    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-venv-{{ checksum "pyproject.toml" }}
            - v2-venv-
      - run:
          name: Install Packages
          command: |
            # A restored .venv cache can be stale: its bin/python3 symlink may
            # point at an interpreter that no longer exists once the base image
            # is rebuilt, which breaks `python3 -m venv .venv`. Recreate the
            # venv from scratch if the cached one is unusable.
            if ! .venv/bin/python3 --version >/dev/null 2>&1; then
              rm -rf .venv
            fi
            python3 -m venv .venv
            echo '. .venv/bin/activate' >> "$BASH_ENV"
            pip install --upgrade pip
            pip install -e ".[dev]"
      - save_cache:
          paths:
            - .venv
          key: v2-venv-{{ checksum "pyproject.toml" }}


      - run:
          name: Lint (Ruff)
          command: ruff check src tests
      - run:
          name: Test (pytest)
          command: pytest -v

      - run:
          name: Runtime smoke test (mcpo + FastMCP boot)
          command: |
            # Regression guard: Dependabot loosened mcp to <3.0.0 and mcp 2.x
            # removed mcp.server.fastmcp + renamed client helpers that mcpo 0.0.20
            # imports (streamablehttp_client -> streamable_http_client). Build,
            # lint and pytest never import mcpo or FastMCP, so that crash only
            # showed up at container runtime. Here we import-check both entrypoints,
            # then boot mcpo for real and probe its HTTP endpoint.
            python -c "import mcpo.main"
            python -c "from nas_port_mcp.server import mcp"
            PORT=39001
            LOG=/tmp/mcpo-boot.log
            mcpo --config config.json --host 127.0.0.1 --port "$PORT" >"$LOG" 2>&1 &
            MCPO_PID=$!
            trap 'kill $MCPO_PID 2>/dev/null || true' EXIT
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$PORT/openapi.json" >/dev/null 2>&1; then
                echo "MCP server boot smoke test OK (mcpo + FastMCP runtime)"
                exit 0
              fi
              sleep 1
            done
            echo "MCP server did not become ready on :$PORT" >&2
            tail -40 "$LOG" >&2 || true
            exit 1



  docker-publish:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Login to Container Registry
          command: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
      - run:
          name: Build and Push Multi-Arch Image
          command: |
            docker buildx create --use || true
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t ghcr.io/nickbrett1/nas-port-mcp:$CIRCLE_SHA1 -t ghcr.io/nickbrett1/nas-port-mcp:latest --push .
workflows:
  build-and-test:
    jobs:
      - build:
          context: common


      - docker-publish:
          context: common
          requires:
            - build
          filters:
            branches:
              only: main
