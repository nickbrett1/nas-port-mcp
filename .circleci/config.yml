version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m venv .venv
            .venv/bin/pip install -e ".[dev]"
      - run:
          name: Lint (ruff)
          command: .venv/bin/ruff check src tests
      - run:
          name: Test (pytest)
          command: .venv/bin/pytest -v

  docker-publish:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Login to GHCR
          command: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
      - run:
          name: Build and Push Multi-Arch Image
          command: |
            docker buildx create --use || true
            docker buildx build --platform linux/amd64,linux/arm64 --provenance=false \
              -t ghcr.io/nickbrett1/nas-port-mcp:$CIRCLE_SHA1 \
              -t ghcr.io/nickbrett1/nas-port-mcp:latest --push .

workflows:
  build-and-test:
    jobs:
      - test:
          context: common
      - docker-publish:
          context: common
          requires:
            - test
          filters:
            branches:
              only: main
